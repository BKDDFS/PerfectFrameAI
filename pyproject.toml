[project]
name = "PerfectFrameAI"
version = "2.4.0"
description = "AI tool for finding the most aesthetic frames in a video. 🎞️➜🖼️"
authors = [
    {name = "Bartłomiej Flis", email = "Bartekdawidflis@gmail.com"}
]
license = {text = "GPL-3.0"}
readme = "README.md"
requires-python = ">=3.11,<3.15"

dependencies = [
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
    "opencv-python==4.13.0.90",
    "requests==2.32.5",
    "onnxruntime==1.23.2",
    "numpy==2.4.1",
]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
    "pre-commit>=4.5.1",
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-order>=1.3.0",
    "docker>=7.1.0",
    "httpx>=0.28.1",
    "testcontainers>=4.14.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
per-file-ignores = {"**/conftest.py"=["F401"]}
