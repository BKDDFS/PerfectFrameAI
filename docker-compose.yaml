services:
  perfectframe:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    volumes:
      - "${INPUT_DIR:-./input_directory}:/app/input_directory"
      - "${OUTPUT_DIR:-./output_directory}:/app/output_directory"
    working_dir: /app
    entrypoint: [ "uvicorn", "perfectframe.app:app", "--host", "0.0.0.0", "--port", "8100" ]

  # GPU-enabled version (use with --profile gpu)
  perfectframe_gpu:
    extends:
      service: perfectframe
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
