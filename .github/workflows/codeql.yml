name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: github/codeql-action/init@2b983b380ce715a6c836c917154509c332c19b3a # v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@2b983b380ce715a6c836c917154509c332c19b3a # v3
